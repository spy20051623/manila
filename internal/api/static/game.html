<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>马尼拉对局</title>
  <link rel="stylesheet" href="/board.css?v=board-50" />
</head>
<body class="game-loading">
  <section id="gameLoadingScreen" class="game-loading-screen" aria-label="游戏加载" aria-live="polite">
    <div class="game-loading-panel">
      <p class="game-loading-eyebrow">马尼拉</p>
      <h1>正在加载对局</h1>
      <div id="gameLoadingProgress" class="game-loading-progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="gameLoadingBar" class="game-loading-bar"></div>
      </div>
      <div class="game-loading-status">
        <strong id="gameLoadingPercent">0%</strong>
        <span id="gameLoadingText">准备资源</span>
      </div>
      <p id="gameLoadingDetail" class="game-loading-detail"></p>
      <div class="game-loading-actions">
        <button id="gameLoadingRetryBtn" type="button" hidden>重试加载</button>
        <button id="gameLoadingReturnBtn" type="button">返回大厅</button>
      </div>
    </div>
  </section>
  <div class="app-shell">
    <main class="table-layout">
      <div class="board-column">
        <section class="top-dashboard" aria-label="当前局面">
          <div class="global-panel">
            <div class="panel-heading compact-heading">
              <h2>全局</h2>
              <button class="help-button" type="button" data-help="global" aria-label="查看全局帮助">?</button>
            </div>
            <div class="status-strip">
              <div class="status-item status-countdown"><span>倒计时</span><strong id="timeoutText">--</strong></div>
              <div class="status-item status-id"><span>局号</span><strong id="gameIdText">-</strong></div>
              <div class="status-item status-number"><span>回合</span><strong id="roundText">-</strong></div>
              <div class="status-item status-phase"><span>阶段</span><strong id="phaseText">-</strong></div>
              <div class="status-item status-player"><span>行动</span><strong id="currentPlayerText">-</strong></div>
              <div class="status-item status-player"><span>港务长</span><strong id="harborMasterText">-</strong></div>
            </div>
          </div>

          <div class="players-top-panel">
            <div class="panel-heading compact-heading">
              <h2>玩家</h2>
              <button class="help-button" type="button" data-help="players" aria-label="查看玩家帮助">?</button>
            </div>
            <div id="playersList" class="players-list"></div>
          </div>

          <div class="ships-top-panel">
            <div class="panel-heading compact-heading">
              <h2>货船</h2>
              <button class="help-button" type="button" data-help="ships" aria-label="查看货船帮助">?</button>
            </div>
            <div id="topShips" class="top-ships"></div>
          </div>
        </section>

        <section class="board-stage" aria-label="棋盘">
          <div class="board-canvas">
            <div class="board-coordinate-layer">
              <img src="/assets/manila-board-base.png" alt="马尼拉棋盘底板" />
              <div class="board-overlay goods-overlay" id="goodsMarket"></div>
              <div class="board-overlay sea-overlay" id="seaLanes"></div>
              <div class="board-overlay dock-overlay" id="dockSlots"></div>
              <div class="board-overlay port-overlay" id="portSlots"></div>
              <div class="board-overlay destination-zone-overlay" id="destinationZones"></div>
              <div class="board-overlay pirate-overlay" id="pirateSlots"></div>
              <div class="board-overlay navigator-overlay" id="navigatorSlots"></div>
              <div class="board-overlay insurance-overlay" id="insuranceSlot"></div>
              <div class="board-overlay help-hotspots" aria-label="棋盘区域帮助">
                <button class="help-button board-help-button board-help-dock" type="button" data-help="dock" aria-label="查看船坞帮助">?</button>
                <button class="help-button board-help-button board-help-port" type="button" data-help="port" aria-label="查看港口帮助">?</button>
                <button class="help-button board-help-button board-help-pirates" type="button" data-help="pirates" aria-label="查看海盗帮助">?</button>
                <button class="help-button board-help-button board-help-navigator" type="button" data-help="navigator" aria-label="查看领航帮助">?</button>
                <button class="help-button board-help-button board-help-insurance" type="button" data-help="insurance" aria-label="查看保险帮助">?</button>
              </div>
            </div>
            <div id="routeNumbers" hidden></div>
          </div>
        </section>
      </div>

      <aside class="command-panel">
        <section class="panel debug-panel">
          <div class="debug-controls" aria-label="游戏控制">
            <button id="tutorialChapterTopBtn" type="button" hidden>选关</button>
            <button id="tutorialRestartTopBtn" type="button" hidden>重开</button>
            <button id="aiStepBtn" type="button">AI 一步</button>
            <button id="aiRoundBtn" type="button">AI 一轮</button>
            <button id="animationToggleBtn" type="button"></button>
            <button id="returnLobbyBtn" type="button">返回大厅</button>
          </div>
        </section>

        <div class="action-slot">
          <section id="actionPanel" class="panel action-panel">
            <div class="panel-heading">
              <h2>行动</h2>
              <button class="help-button" type="button" data-help="actions" aria-label="查看行动帮助">?</button>
            </div>
            <div id="contextControls" class="context-controls"></div>
            <div id="actionsList" class="actions-list"></div>
          </section>

          <section id="tutorialChapterPanel" class="panel tutorial-chapter-panel" hidden>
            <div class="panel-heading">
              <h2>选关</h2>
            </div>
            <div id="tutorialChapterList" class="tutorial-chapter-list"></div>
          </section>
        </div>

        <section class="panel events-panel">
          <div class="panel-heading events-heading">
            <h2>事件</h2>
            <button class="help-button" type="button" data-help="events" aria-label="查看事件帮助">?</button>
          </div>
          <button id="eventsLatestBtn" class="events-latest-button" type="button" hidden>返回最新</button>
          <div id="eventsList" class="events-list"></div>
          <aside id="tutorialPanel" class="tutorial-panel" hidden></aside>
        </section>
      </aside>
    </main>
  </div>

  <div id="settlementOverlay" class="settlement-overlay" hidden></div>
  <div id="helpOverlay" class="help-overlay" hidden>
    <section class="help-dialog" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
      <button id="helpCloseBtn" class="help-close" type="button" aria-label="关闭帮助"></button>
      <h2 id="helpTitle">帮助</h2>
      <div id="helpBody" class="help-body"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/game.js?v=game-69" defer></script>
</body>
</html>
