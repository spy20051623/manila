<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>马尼拉大厅</title>
  <link rel="stylesheet" href="/board.css?v=lobby-3" />
</head>
<body>
  <div id="lobbyOverlay" class="lobby-overlay">
    <section class="lobby-panel" aria-label="联机大厅">
      <div class="lobby-head">
        <div>
          <p id="lobbyStatusText">准备大厅</p>
          <h1>马尼拉</h1>
        </div>
        <div class="lobby-identity">
          <span id="lobbyJoinedText">观战身份</span>
          <button id="lobbyRenameBtn" type="button" hidden>更改名字</button>
          <button id="lobbyJoinBtn" type="button">加入房间</button>
        </div>
      </div>

      <div class="lobby-seat-zone">
        <div id="lobbySeats" class="lobby-seats"></div>
        <div id="lobbyGameOverlay" class="lobby-game-overlay" hidden>
          <div class="lobby-game-overlay-panel">
            <strong>当前有对局正在进行</strong>
            <button id="enterGameBtn" type="button">进入对局</button>
          </div>
        </div>
      </div>

      <section class="completed-games-section" aria-label="已完成对局">
        <div class="completed-games-head">
          <h2>已完成对局</h2>
          <span>点击任意记录可查看旧对局</span>
        </div>
        <div id="completedGamesList" class="completed-games-list"></div>
      </section>
    </section>
  </div>

  <div id="nameDialogOverlay" class="name-dialog-overlay" hidden>
    <form id="nameDialogForm" class="name-dialog" role="dialog" aria-modal="true" aria-labelledby="nameDialogTitle">
      <button id="nameDialogCloseBtn" class="help-close" type="button" aria-label="关闭"></button>
      <p id="nameDialogEyebrow" class="name-dialog-eyebrow">联机大厅</p>
      <h2 id="nameDialogTitle">玩家名字</h2>
      <label class="name-dialog-field" for="nameDialogInput">
        <span>显示名字</span>
        <input id="nameDialogInput" type="text" maxlength="12" autocomplete="off" />
      </label>
      <div class="name-dialog-footer">
        <span id="nameDialogCounter">0/12</span>
        <div class="name-dialog-actions">
          <button id="nameDialogCancelBtn" type="button">取消</button>
          <button id="nameDialogSubmitBtn" type="submit">确认</button>
        </div>
      </div>
    </form>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/lobby.js?v=lobby-3" defer></script>
</body>
</html>
